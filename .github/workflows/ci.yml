name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Synthetic channel CLI integration
        run: python scripts/test_local_channel.py --binary target/debug/wx-cli
      - name: Sender contract against compiled CLI events
        env:
          PYTHONPATH: packages/wx-agent/src
        run: python -m unittest scripts.test_macos_sender_driver.SenderTests.test_real_synthetic_channel_event_contract

  python:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check public source
        run: python scripts/check_public_source.py
      - name: Test repository scripts
        env:
          PYTHONPATH: packages/wx-agent/src
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build Python wheel
        run: python -m pip wheel --no-deps --wheel-dir dist ./packages/wx-agent
      - name: Install and smoke test wheel away from checkout
        run: python scripts/check_package.py dist/*.whl --tests packages/wx-agent/tests

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Native bridge parameter tests
        run: native/macos/wechat-bridge/test-parameters.sh

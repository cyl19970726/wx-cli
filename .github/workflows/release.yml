name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Match tag to workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Extract changelog
        id: changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          BODY=$(awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md)
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$BODY"
            echo 'Artifact: source-built macOS arm64 CLI archive. It is not signed or notarized; the native bridge and Python agent are not included.'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build release (arm64)
        run: cargo build --locked --release --target aarch64-apple-darwin
      - name: Package binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd target/aarch64-apple-darwin/release
          chmod +x wx-cli
          tar czf "$GITHUB_WORKSPACE/wx-cli-${RELEASE_TAG}-macos-arm64.tar.gz" wx-cli
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: wx-cli-${{ github.ref_name }}-macos-arm64.tar.gz
          body: ${{ steps.changelog.outputs.body }}
